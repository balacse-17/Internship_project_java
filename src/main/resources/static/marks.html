<!DOCTYPE html>

<html>

<head>

<title>Marks Entry</title>

<link rel="stylesheet" href="marks.css">

</head>

<body>

<div class="container">

<h1>Marks Entry</h1>

<div class="form">

<input type="number" id="rollNo" placeholder="Roll Number">

<button onclick="searchStudent()">

Search

</button>

<input type="text" id="name" readonly>

<input type="number" id="tamil" placeholder="Tamil">

<input type="number" id="english" placeholder="English">

<input type="number" id="maths" placeholder="Maths">

<input type="number" id="science" placeholder="Science">

<input type="number" id="social" placeholder="Social Science">

<button onclick="saveMarks()">

Save Marks

</button>

</div>

<br>

<table>

<thead>

<tr>

<th>Roll</th>

<th>Name</th>

<th>Tamil</th>

<th>English</th>

<th>Maths</th>

<th>Science</th>

<th>Social</th>

<th>Grade</th>

</tr>

</thead>

<tbody id="marksTable">

</tbody>

</table>

<br>

<button onclick="location.href='index.html'">

Back

</button>

</div>

<script src="marks.js"></script>

</body>

</html>
